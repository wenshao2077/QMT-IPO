name: Offline verification
on:
  push:
    branches: ['codex/qmt-ipo-3.4-final']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify delivery manifest without SDK installation
        run: python -B -c "from package_verify import verify_directory; verify_directory('.')"
      - name: Linux isolated business and GUI tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B -m unittest -v test_system test_panel test_run_history test_calendar_delivery test_delivery_round1 test_discovery_round1 test_release_round1 test_maintenance_round2 test_package_round2 test_ui_round2 test_final_delivery
      - name: Windows isolated business and GUI tests
        if: runner.os == 'Windows'
        run: python -B -m unittest -v test_system test_panel test_run_history test_calendar_delivery test_delivery_round1 test_discovery_round1 test_release_round1 test_maintenance_round2 test_package_round2 test_ui_round2 test_final_delivery
      - name: Windows definitions and PowerShell parser only
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\test_tasks.ps1'
      - name: Build final candidate ZIP
        run: python -B build_release.py --output "${{ runner.temp }}/round2-final.zip"
      - name: Verify and extract the locally built candidate without executing it
        run: >-
          python -B -c "from package_verify import verify_zip; import zipfile;
          p=r'${{ runner.temp }}/round2-final.zip'; verify_zip(p);
          zipfile.ZipFile(p).extractall(r'${{ runner.temp }}/round2-unpacked')"
      - name: Linux final ZIP regression
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/round2-unpacked/QMT-IPO-3.4.0-source
        run: xvfb-run -a python -B -m unittest -v test_system test_panel test_run_history test_calendar_delivery test_delivery_round1 test_discovery_round1 test_release_round1 test_maintenance_round2 test_package_round2 test_ui_round2 test_final_delivery
      - name: Windows final ZIP regression
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/round2-unpacked/QMT-IPO-3.4.0-source
        run: python -B -m unittest -v test_system test_panel test_run_history test_calendar_delivery test_delivery_round1 test_discovery_round1 test_release_round1 test_maintenance_round2 test_package_round2 test_ui_round2 test_final_delivery
      - name: Windows final ZIP PowerShell parser checks
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}/round2-unpacked/QMT-IPO-3.4.0-source
        run: '& .\test_tasks.ps1'
  source:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build checked review source after every test job succeeds
        run: python -B build_release.py --output "$RUNNER_TEMP/qmt-ipo-review-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-candidate
          path: ${{ runner.temp }}/qmt-ipo-review-source.zip
          retention-days: 30
