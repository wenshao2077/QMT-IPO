name: Delivery materials (no account or SDK execution)
on:
  push:
    branches: ['review/delivery-round3-20260914']
    paths: ['.github/workflows/delivery-materials.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned public artifacts and record provenance (never import SDK)
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request
          root=pathlib.Path('materials'); root.mkdir()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'QMT-IPO-delivery-review'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.read()
          release=json.loads(get('https://api.github.com/repos/astral-sh/python-build-standalone/releases/tags/20260901'))
          candidates=[a for a in release['assets'] if a['name'].startswith('cpython-3.11.16+') and 'x86_64-pc-windows-msvc' in a['name'] and a['name'].endswith('-install_only.tar.gz')]
          print('RUNTIME_CANDIDATES',json.dumps([{k:a.get(k) for k in ('name','size','digest','browser_download_url')} for a in candidates]))
          assert len(candidates)==1, 'Runtime identity ambiguous; stop'
          runtime=candidates[0]; data=get(runtime['browser_download_url']); sha=hashlib.sha256(data).hexdigest()
          assert runtime.get('digest')=='sha256:'+sha, 'Runtime SHA-256 mismatch or unavailable'
          (root/runtime['name']).write_bytes(data)
          records=[{'kind':'runtime','filename':runtime['name'],'sha256':sha,'size':len(data),'url':runtime['browser_download_url'],'release':release['html_url'],'executed':False}]
          packages=[
            ('xtquant','250807.1.2','xtquant-250807.1.2-py3-none-any.whl','91f19ff9a92971c5abe64fbd077e5212e0418f0820aa3427aef3444230f72921'),
            ('numpy','1.26.4','numpy-1.26.4-cp311-cp311-win_amd64.whl','cd25bcecc4974d09257ffcd1f098ee778f7834c3ad767fe5db785be9a4aa9cb2'),
            ('pandas','2.2.3','pandas-2.2.3-cp311-cp311-win_amd64.whl','3fc6873a41186404dad67245896a6e440baacc92f5b716ccd1bc9ed2995ab2c5'),
            ('python-dateutil','2.9.0.post0','python_dateutil-2.9.0.post0-py2.py3-none-any.whl','a8b2bc7bffae282281c8140a97d3aa9c14da0b136dfe83f850eea9a5f7470427'),
            ('pytz','2025.2','pytz-2025.2-py2.py3-none-any.whl','5ddf76296dd8c44c26eb8f4b6f35488f3ccbf6fbbd7adee0b7262d43f0ec2f00'),
            ('tzdata','2025.2','tzdata-2025.2-py2.py3-none-any.whl','1a403fada01ff9221ca8044d701868fa132215d84beb92242d9acd2147f667a8'),
            ('six','1.17.0','six-1.17.0-py2.py3-none-any.whl','4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274')]
          for name,version,filename,expected in packages:
              metadata=json.loads(get(f'https://pypi.org/pypi/{name}/{version}/json'))
              asset=next(a for a in metadata['urls'] if a['filename']==filename)
              assert asset['digests']['sha256']==expected and not asset['yanked']
              data=get(asset['url']); assert hashlib.sha256(data).hexdigest()==expected
              (root/filename).write_bytes(data)
              records.append({'kind':'wheel','name':name,'version':version,'filename':filename,'sha256':expected,'size':len(data),'url':asset['url'],'metadata_url':f'https://pypi.org/pypi/{name}/{version}/json','requires_dist':metadata['info'].get('requires_dist'),'license':metadata['info'].get('license'),'executed':False})
          (root/'provenance.json').write_text(json.dumps({'schema_version':1,'purpose':'private material review; no redistribution authorization asserted','records':records},ensure_ascii=False,indent=2),encoding='utf-8')
          print('Downloaded',len(records),'artifacts; no SDK imports, accounts, tasks, notifications or deployment')
      - uses: actions/upload-artifact@v4
        with:
          name: round3-materials-review
          path: materials/
          retention-days: 7
